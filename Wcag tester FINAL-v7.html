<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WCAG Color Contrast Matrix Professional</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              neutral: {
                50: '#fafafa',
                100: '#f5f5f5',
                200: '#e5e5e5',
                300: '#d4d4d4',
                400: '#a3a3a3',
                500: '#737373',
                600: '#525252',
                700: '#404040',
                800: '#262626',
                900: '#171717',
              },
            },
            fontFamily: {
              sans: ['Inter', 'system-ui', 'sans-serif'],
            },
          },
        },
      }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- React -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
      body, html {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        font-family: 'Inter', sans-serif;
        background: #fafafa;
      }

      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      ::-webkit-scrollbar-track {
        background: #f5f5f5;
      }
      ::-webkit-scrollbar-thumb {
        background: #d4d4d4;
        border-radius: 5px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #a3a3a3;
      }

      .app-layout {
        display: flex;
        flex-direction: column;
        height: 100vh;
      }

      .top-section {
        flex-shrink: 0;
        border-bottom: 1px solid #e5e5e5;
        background: white;
        z-index: 100;
        max-height: 45vh;
        overflow-y: auto;
        box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05);
      }

      .grid-area {
        flex: 1;
        overflow: auto;
        position: relative;
        background: #fafafa;
      }

      .tri-state-filter {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.25rem 0.5rem;
        border-radius: 0.375rem;
        cursor: pointer;
        user-select: none;
        transition: all 0.1s ease;
        border: 1px solid transparent;
      }

      .tri-state-filter:hover {
        background: #f5f5f5;
      }

      .tri-state-filter.included {
        background: #f0fdf4;
        border-color: #bbf7d0;
      }

      .tri-state-filter.excluded {
        background: #fef2f2;
        border-color: #fecaca;
      }

      /* Range slider styling */
      input[type=range] {
        -webkit-appearance: none;
        width: 100%;
        background: transparent;
      }
      input[type=range]:focus {
        outline: none;
      }
      input[type=range]::-webkit-slider-runnable-track {
        width: 100%;
        height: 4px;
        cursor: pointer;
        background: #e5e5e5;
        border-radius: 2px;
      }
      input[type=range]::-webkit-slider-thumb {
        height: 16px;
        width: 16px;
        border-radius: 50%;
        background: #171717;
        cursor: pointer;
        -webkit-appearance: none;
        margin-top: -6px;
        box-shadow: 0 0 0 4px white;
        border: 1px solid #e5e5e5;
      }

      .segmented-control {
        display: flex;
        background: #f5f5f5;
        padding: 2px;
        border-radius: 0.5rem;
      }
      .segmented-item {
        flex: 1;
        text-align: center;
        padding: 0.35rem 0.5rem;
        font-size: 0.65rem;
        font-weight: 800;
        border-radius: 0.375rem;
        cursor: pointer;
        transition: all 0.1s;
        color: #737373;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .segmented-item.active {
        background: white;
        color: #171717;
        box-shadow: 0 1px 2px rgba(0,0,0,0.05);
      }

      .grid-wrapper {
        display: inline-grid;
        padding: 32px;
        min-width: 100%;
        justify-content: center;
      }

      .sticky-header-col {
        position: sticky;
        top: 0;
        background: #fafafa;
        z-index: 40;
        padding-bottom: 16px;
      }

      .sticky-header-row {
        position: sticky;
        left: 0;
        background: #fafafa;
        z-index: 30;
        padding-right: 16px;
      }

      .sticky-corner {
        z-index: 50;
      }
    </style>
  </head>

  <body class="bg-white text-neutral-900 font-sans antialiased">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useMemo, useEffect } = React;

      // -------- Helpers --------
      const hexToRgb = (hex) => {
        const clean = hex.replace("#", "");
        const bigint = parseInt(clean, 16);
        return {
          r: (bigint >> 16) & 255,
          g: (bigint >> 8) & 255,
          b: bigint & 255,
        };
      };

      const luminance = ({ r, g, b }) => {
        const t = (c) => {
          const v = c / 255;
          return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
        };
        return 0.2126 * t(r) + 0.7152 * t(g) + 0.0722 * t(b);
      };

      const getHsl = (hex) => {
        let { r, g, b } = hexToRgb(hex);
        r /= 255; g /= 255; b /= 255;
        const max = Math.max(r, g, b), min = Math.min(r, g, b);
        let h, s, l = (max + min) / 2;
        if (max === min) { h = s = 0; }
        else {
          const d = max - min;
          s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
          switch (max) {
            case r: h = (g - b) / d + (g < b ? 6 : 0); break;
            case g: h = (b - r) / d + 2; break;
            case b: h = (r - g) / d + 4; break;
          }
          h /= 6;
        }
        return { h: h * 360, s: s * 100, l: l * 100 };
      };

      const contrastRatio = (a, b) => {
        const L1 = luminance(hexToRgb(a));
        const L2 = luminance(hexToRgb(b));
        return +((Math.max(L1, L2) + 0.05) / (Math.min(L1, L2) + 0.05)).toFixed(2);
      };

      const pass = (r, t) => r >= t;

      const getVisualTensionScore = (c1, c2) => {
        const hsl1 = getHsl(c1);
        const hsl2 = getHsl(c2);
        const lumDiff = Math.abs(hsl1.l - hsl2.l);
        const hueDiff = Math.min(Math.abs(hsl1.h - hsl2.h), 360 - Math.abs(hsl1.h - hsl2.h));
        const avgSat = (hsl1.s + hsl2.s) / 2;

        let score = 0;
        if (avgSat > 20 && lumDiff < 50) {
            score += (avgSat / 100) * (hueDiff / 180) * (1 - lumDiff/50) * 15;
        }
        if (avgSat > 40 && hueDiff > 100) {
            score += (avgSat / 100) * (hueDiff / 180) * 5;
        }
        return Math.min(10, Math.round(score * 10) / 10);
      };

      function generateContrastGridSVG({
        gridBg, gridFg, colors, minContrast, maxContrast, uniqueMode, darknessFilter, rowFilters, colFilters, maxTension
      }) {
        const cellWidth = 160;
        const cellHeight = 240;
        const cellGap = 12;
        const headerHeight = 60;
        const rowLabelWidth = 100;

        const isHidden = (bg, fg, bgIndex, fgIndex) => {
          const ratio = contrastRatio(bg, fg);
          const tension = getVisualTensionScore(bg, fg);
          if (ratio < minContrast || (maxContrast !== Infinity && ratio > maxContrast) || tension > maxTension) return true;
          if (uniqueMode === "bg" && bgIndex > fgIndex) return true;
          if (uniqueMode === "fg" && bgIndex < fgIndex) return true;
          const lumBg = luminance(hexToRgb(bg)), lumFg = luminance(hexToRgb(fg));
          if (darknessFilter === "bg-darker" && lumBg >= lumFg) return true;
          if (darknessFilter === "fg-darker" && lumFg >= lumBg) return true;
          if (rowFilters[bg] === -1 || colFilters[fg] === -1) return true;
          const hIR = Object.values(rowFilters).some(v => v === 1), hIC = Object.values(colFilters).some(v => v === 1);
          if (hIR && rowFilters[bg] !== 1) return true;
          if (hIC && colFilters[fg] !== 1) return true;
          return false;
        };

        const svgGridBg = gridBg.filter(bg => colors.some(fg => !isHidden(bg, fg, colors.indexOf(bg), colors.indexOf(fg))));
        const svgGridFg = gridFg.filter(fg => colors.some(bg => !isHidden(bg, fg, colors.indexOf(bg), colors.indexOf(fg))));

        const width = rowLabelWidth + (svgGridFg.length * (cellWidth + cellGap));
        const height = headerHeight + (svgGridBg.length * (cellHeight + cellGap));

        let svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" font-family="sans-serif">`;

        svgGridFg.forEach((fg, colIndex) => {
          const x = rowLabelWidth + colIndex * (cellWidth + cellGap) + cellWidth / 2;
          svg += `<text x="${x}" y="34" font-size="11" text-anchor="middle" fill="#737373" font-weight="900">${fg}</text>`;
        });

        svgGridBg.forEach((bg, rowIndex) => {
          const rowY = headerHeight + rowIndex * (cellHeight + cellGap);
          svg += `<text x="${rowLabelWidth - 12}" y="${rowY + 24}" font-size="11" text-anchor="end" fill="#737373" font-weight="900">${bg}</text>`;

          svgGridFg.forEach((fg, colIndex) => {
            if (isHidden(bg, fg, colors.indexOf(bg), colors.indexOf(fg))) return;
            const x = rowLabelWidth + colIndex * (cellWidth + cellGap);
            const ratio = contrastRatio(bg, fg);
            const tension = getVisualTensionScore(bg, fg);

            svg += `
<g transform="translate(${x}, ${rowY})">
  <rect width="${cellWidth}" height="${cellHeight}" rx="12" fill="${bg}" stroke="#e5e5e5" stroke-width="1"/>
  <text x="14" y="38" font-size="28" font-weight="900" fill="${fg}">${ratio}:1</text>
  ${tension >= 5 ? `<text x="${cellWidth - 14}" y="38" font-size="18" text-anchor="end">⚠️</text>` : ""}

  <text x="14" y="70" font-size="11" fill="${fg}" font-weight="900">${pass(ratio, 3) ? "✅" : "❌"} 3:1 GRAPHICS</text>
  <text x="14" y="90" font-size="11" fill="${fg}" font-weight="900">${pass(ratio, 4.5) ? "✅" : "❌"} 4.5:1 AA TEXT</text>
  <text x="14" y="110" font-size="11" fill="${fg}" font-weight="900">${pass(ratio, 7) ? "✅" : "❌"} 7:1 AAA TEXT</text>

  <rect y="${cellHeight - 50}" width="${cellWidth}" height="50" fill="#ffffff" rx="12" />
  <rect y="${cellHeight - 50}" width="${cellWidth}" height="10" fill="#ffffff" />
  <line x1="0" y1="${cellHeight - 50}" x2="${cellWidth}" y2="${cellHeight - 50}" stroke="#f0f0f0" stroke-width="1"/>

  <text x="14" y="${cellHeight - 32}" font-size="9" fill="#171717" font-weight="900" text-transform="uppercase">TEXT ${fg}</text>
  <text x="14" y="${cellHeight - 14}" font-size="9" fill="#737373" font-weight="900" text-transform="uppercase">BG ${bg}</text>

  <text x="${cellWidth - 14}" y="${cellHeight - 32}" font-size="11" fill="#171717" font-weight="900" text-anchor="end">${ratio}:1</text>
  <text x="${cellWidth - 14}" y="${cellHeight - 14}" font-size="9" fill="#737373" font-weight="900" text-anchor="end">${pass(ratio, 3) ? "OK" : "KO"} / ${pass(ratio, 4.5) ? "AA" : "KO"} / ${pass(ratio, 7) ? "AAA" : "KO"}</text>
</g>`;
          });
        });

        svg += `</svg>`;
        return svg;
      }

      // -------- Components --------

      const TriStateFilter = ({ color, state, onChange }) => {
        const handleClick = () => {
          if (state === 0) onChange(1);
          else if (state === 1) onChange(-1);
          else onChange(0);
        };
        return (
          <div className={`tri-state-filter ${state === 1 ? 'included' : state === -1 ? 'excluded' : ''}`} onClick={handleClick}>
            <div className="w-3.5 h-3.5 rounded-sm shadow-sm border border-black/5" style={{ backgroundColor: color }}></div>
            <span className="text-[10px] font-extrabold text-neutral-600 font-mono tracking-tighter">{color}</span>
            <div className="ml-auto flex gap-1">
                {state === 1 && <div className="w-1.5 h-1.5 rounded-full bg-green-500"></div>}
                {state === -1 && <div className="w-1.5 h-1.5 rounded-full bg-red-500"></div>}
                {state === 0 && <div className="w-1.5 h-1.5 rounded-full bg-neutral-200"></div>}
            </div>
          </div>
        );
      };

      const RangeSlider = ({ label, value, min, max, step, onChange, thresholds, unit = "" }) => (
          <div className="space-y-1">
            <div className="flex justify-between items-center">
              <label className="text-[9px] font-black text-neutral-400 uppercase tracking-widest">{label}</label>
              <span className="text-[10px] font-black font-mono bg-neutral-50 px-1.5 py-0.5 rounded border border-neutral-100">{value === Infinity ? '∞' : value}{unit}</span>
            </div>
            <input type="range" min={min} max={max} step={step} value={value === Infinity ? max : value} onChange={(e) => onChange(Number(e.target.value) === max ? (max === 21 ? Infinity : max) : Number(e.target.value))} />
            <div className="flex justify-between px-0.5">
              {thresholds.map(t => (
                <button key={t} onClick={() => onChange(t)} className={`text-[8px] transition-colors ${value === t ? 'text-black font-black' : 'text-neutral-300 font-black hover:text-neutral-500'}`}>{t}</button>
              ))}
            </div>
          </div>
      );

      const SegmentedControl = ({ options, value, onChange, label }) => (
          <div className="space-y-1">
            <label className="text-[9px] font-black text-neutral-400 uppercase tracking-widest">{label}</label>
            <div className="segmented-control">
              {options.map(opt => (
                <div key={opt.value} className={`segmented-item ${value === opt.value ? 'active' : ''}`} onClick={() => onChange(opt.value)}>{opt.label}</div>
              ))}
            </div>
          </div>
      );

      // -------- App --------

      function App() {
        const [input, setInput] = useState("#000000, #ffffff, #2563eb, #db2777, #f59e0b, #10b981");
        const [minContrast, setMinContrast] = useState(0);
        const [maxContrast, setMaxContrast] = useState(Infinity);
        const [maxTension, setMaxTension] = useState(10);
        const [uniqueMode, setUniqueMode] = useState("all");
        const [collapseEmpty, setCollapseEmpty] = useState(false);
        const [darknessFilter, setDarknessFilter] = useState("all");

        const [rowFilters, setRowFilters] = useState({});
        const [colFilters, setColFilters] = useState({});

        const colors = useMemo(() => Array.from(new Set(input.match(/#[0-9A-Fa-f]{6}/g) || [])), [input]);

        useEffect(() => {
          setRowFilters(p => { const n = {}; colors.forEach(c => n[c] = p[c] || 0); return n; });
          setColFilters(p => { const n = {}; colors.forEach(c => n[c] = p[c] || 0); return n; });
        }, [colors]);

        const isHidden = (bg, fg, bgIndex, fgIndex) => {
          const ratio = contrastRatio(bg, fg);
          const tension = getVisualTensionScore(bg, fg);
          if (ratio < minContrast || (maxContrast !== Infinity && ratio > maxContrast) || tension > maxTension) return true;
          if (uniqueMode === "bg" && bgIndex > fgIndex) return true;
          if (uniqueMode === "fg" && bgIndex < fgIndex) return true;
          const lumBg = luminance(hexToRgb(bg)), lumFg = luminance(hexToRgb(fg));
          if (darknessFilter === "bg-darker" && lumBg >= lumFg) return true;
          if (darknessFilter === "fg-darker" && lumFg >= lumBg) return true;
          if (rowFilters[bg] === -1 || colFilters[fg] === -1) return true;
          const hIR = Object.values(rowFilters).some(v => v === 1), hIC = Object.values(colFilters).some(v => v === 1);
          if (hIR && rowFilters[bg] !== 1) return true;
          if (hIC && colFilters[fg] !== 1) return true;
          return false;
        };

        const gridBg = collapseEmpty ? colors.filter((bg, i) => colors.some((fg, j) => !isHidden(bg, fg, i, j))) : colors;
        const gridFg = collapseEmpty ? colors.filter((fg, j) => colors.some((bg, i) => !isHidden(bg, fg, i, j))) : colors;

        const addColor = (hex) => {
          if (!colors.includes(hex)) {
            setInput(p => {
              const t = p.trim();
              if (!t) return hex;
              const last = t[t.length - 1];
              return (last === ',' || last === ' ') ? p + hex : p + ", " + hex;
            });
          }
        };

        const copySVG = async () => {
          try {
            await navigator.clipboard.writeText(generateContrastGridSVG({ gridBg, gridFg, colors, minContrast, maxContrast, uniqueMode, darknessFilter, rowFilters, colFilters, maxTension }));
            alert("SVG skopiowane!");
          } catch (err) { alert("Błąd"); }
        };

        const downloadSVG = () => {
          const blob = new Blob([generateContrastGridSVG({ gridBg, gridFg, colors, minContrast, maxContrast, uniqueMode, darknessFilter, rowFilters, colFilters, maxTension })], { type: "image/svg+xml;charset=utf-8;" });
          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.href = url; link.download = "contrast-grid.svg"; link.click();
          URL.revokeObjectURL(url);
        };

        return (
          <div className="app-layout">
            <header className="top-section p-6 lg:p-10">
              <div className="max-w-[1920px] mx-auto grid grid-cols-1 lg:grid-cols-12 gap-8">
                <div className="lg:col-span-4 space-y-4">
                  <div className="flex items-baseline gap-3">
                    <h1 className="text-3xl font-black tracking-tighter text-neutral-900">WCAG Matrix</h1>
                    <span className="text-[10px] font-black text-neutral-400 uppercase tracking-widest">Professional v2</span>
                  </div>
                  <div className="space-y-2">
                    <div className="flex justify-between items-center"><label className="text-[9px] font-black text-neutral-400 uppercase tracking-widest">Kolory wejściowe</label>
                    <div className="flex gap-2">
                        <button onClick={() => addColor("#000000")} className="text-[9px] font-bold px-2 py-0.5 bg-neutral-100 rounded uppercase tracking-wider hover:bg-neutral-200">+ Black</button>
                        <button onClick={() => addColor("#ffffff")} className="text-[9px] font-bold px-2 py-0.5 bg-neutral-100 rounded uppercase tracking-wider hover:bg-neutral-200">+ White</button>
                    </div></div>
                    <textarea rows="2" className="w-full p-4 bg-neutral-50 border border-neutral-100 rounded-xl font-mono text-[11px] focus:outline-none focus:ring-1 focus:ring-neutral-200 transition-all resize-none leading-relaxed" value={input} onChange={(e) => setInput(e.target.value)} />
                  </div>
                </div>
                <div className="lg:col-span-3 space-y-5">
                    <RangeSlider label="Kontrast Min" value={minContrast} min={0} max={21} step={0.1} onChange={setMinContrast} thresholds={[0, 3, 4.5, 7, 21]} />
                    <RangeSlider label="Kontrast Max" value={maxContrast} min={0} max={21} step={0.1} onChange={setMaxContrast} thresholds={[0, 3, 4.5, 7, 21]} />
                    <RangeSlider label="Gryzienie (Limit)" value={maxTension} min={0} max={10} step={0.5} onChange={setMaxTension} thresholds={[2, 5, 8, 10]} unit="/10" />
                </div>
                <div className="lg:col-span-3 space-y-4">
                    <SegmentedControl label="Unikalność" value={uniqueMode} onChange={setUniqueMode} options={[{ label: 'Wszystkie', value: 'all' }, { label: 'Pół (Tła)', value: 'bg' }, { label: 'Pół (Teksty)', value: 'fg' }]} />
                    <SegmentedControl label="Relacja Jasności" value={darknessFilter} onChange={setDarknessFilter} options={[{ label: 'Wszystkie', value: 'all' }, { label: 'Tło ciemne', value: 'bg-darker' }, { label: 'Tekst ciemny', value: 'fg-darker' }]} />
                    <label className="flex items-center gap-2 text-[10px] font-black text-neutral-400 uppercase tracking-widest cursor-pointer group pt-1">
                        <input type="checkbox" className="w-3.5 h-3.5 rounded-sm border-neutral-200 text-neutral-900 focus:ring-0" checked={collapseEmpty} onChange={(e) => setCollapseEmpty(e.target.checked)} />
                        <span className="group-hover:text-black transition-colors">Ukryj puste komórki</span>
                    </label>
                </div>
                <div className="lg:col-span-2 flex flex-col justify-end gap-2.5 pb-1">
                    <button onClick={copySVG} className="w-full py-2.5 bg-neutral-900 text-white rounded-xl text-[10px] font-black uppercase tracking-widest hover:bg-neutral-800 transition-all active:scale-[0.98] shadow-sm">Copy SVG</button>
                    <button onClick={downloadSVG} className="w-full py-2.5 bg-white text-neutral-900 border border-neutral-200 rounded-xl text-[10px] font-black uppercase tracking-widest hover:bg-neutral-50 transition-all active:scale-[0.98]">Download SVG</button>
                    <div className="text-[8px] text-neutral-400 font-bold uppercase tracking-widest leading-tight text-center">⚠️ Gryzienie {'>'} 5.0 (Vibration)</div>
                </div>
              </div>
              <div className="max-w-[1920px] mx-auto mt-8 grid grid-cols-1 lg:grid-cols-2 gap-10 border-t border-neutral-50 pt-5">
                <div className="space-y-2.5"><h3 className="text-[9px] font-black text-neutral-400 uppercase tracking-widest">Filtruj Wiersze (Tło)</h3>
                  <div className="flex flex-wrap gap-x-4 gap-y-1">{colors.map(c => <TriStateFilter key={c} color={c} state={rowFilters[c] || 0} onChange={(val) => setRowFilters(p => ({...p, [c]: val}))} />)}</div></div>
                <div className="space-y-2.5"><h3 className="text-[9px] font-black text-neutral-400 uppercase tracking-widest">Filtruj Kolumny (Tekst)</h3>
                  <div className="flex flex-wrap gap-x-4 gap-y-1">{colors.map(c => <TriStateFilter key={c} color={c} state={colFilters[c] || 0} onChange={(val) => setColFilters(p => ({...p, [c]: val}))} />)}</div></div>
              </div>
            </header>
            <main className="grid-area">
              <div className="grid-wrapper">
                <div className="inline-grid gap-3" style={{ gridTemplateColumns: `100px repeat(${gridFg.length}, 160px)` }}>
                  <div className="sticky-header-col sticky-header-row sticky-corner flex items-end justify-end p-2 text-[9px] font-black text-neutral-300 uppercase tracking-widest border-b border-neutral-100">BG / FG</div>
                  {gridFg.map(c => (<div key={c} className="sticky-header-col flex flex-col items-center justify-center p-2 border-b border-neutral-100">
                      <div className="w-6 h-1 rounded-full mb-1" style={{ backgroundColor: c }}></div>
                      <div className="font-mono text-[9px] text-neutral-500 font-black tracking-tighter">{c}</div>
                    </div>))}
                  {gridBg.map((bg, i) => (
                    <React.Fragment key={bg}>
                      <div className="sticky-header-row flex items-center justify-end pr-5 gap-3 h-[240px]">
                        <div className="font-mono text-[9px] text-neutral-500 font-black tracking-tighter">{bg}</div>
                        <div className="w-1.5 h-6 rounded-full" style={{ backgroundColor: bg }}></div>
                      </div>
                      {gridFg.map((fg, j) => {
                        const r = contrastRatio(bg, fg), t = getVisualTensionScore(bg, fg), h = isHidden(bg, fg, colors.indexOf(bg), colors.indexOf(fg));
                        if (collapseEmpty && h) return <div key={bg+fg}></div>;
                        return (
                          <div key={bg+fg} className={`w-[160px] h-[240px] rounded-xl overflow-hidden border border-neutral-100 transition-all flex flex-col ${h ? "opacity-5 grayscale blur-[1px]" : "hover:shadow-2xl hover:border-neutral-400 hover:z-10 bg-white"}`}>
                            <div className="flex-grow p-5 flex flex-col justify-between" style={{ background: bg, color: fg }}>
                              <div className="flex justify-between items-start"><div className="text-3xl font-black tracking-tighter leading-none">{r}:1</div>{t >= 5 && <span className="text-base" title={`Napięcie: ${t}`}>⚠️</span>}</div>
                              <div className="space-y-2.5">{[{l:'3:1 Graphics',v:3},{l:'4.5:1 AA Text',v:4.5},{l:'7:1 AAA Text',v:7}].map(ln => (
                                <div key={ln.l} className={`flex items-center gap-2 text-[10px] font-black ${pass(r,ln.v)?'opacity-100':'opacity-30'}`}>
                                  <span>{pass(r,ln.v)?"✅":"❌"}</span><span className="uppercase tracking-tight leading-none">{ln.l}</span>
                                </div>))}</div>
                            </div>
                            <div className="bg-white p-4 flex flex-col gap-1 border-t border-neutral-100">
                              <div className="flex justify-between items-center"><span className="text-[10px] text-neutral-900 font-black uppercase tracking-tight">TEXT {fg}</span><span className="text-[10px] text-neutral-900 font-black">{r}:1</span></div>
                              <div className="flex justify-between items-center"><span className="text-[10px] text-neutral-400 font-extrabold uppercase tracking-tight">BG {bg}</span><span className="text-[10px] text-neutral-400 font-extrabold">{pass(r, 3) ? "OK" : "KO"} / {pass(r, 4.5) ? "AA" : "KO"} / {pass(r, 7) ? "AAA" : "KO"}</span></div>
                            </div>
                          </div>
                        );
                      })}
                    </React.Fragment>
                  ))}
                </div>
              </div>
            </main>
          </div>
        );
      }
      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
