<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <title>WCAG Color Contrast Matrix</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>

  <body class="bg-neutral-50">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useMemo } = React;

      // -------- WCAG helpers --------
      const hexToRgb = (hex) => {
        const clean = hex.replace("#", "");
        const bigint = parseInt(clean, 16);
        return {
          r: (bigint >> 16) & 255,
          g: (bigint >> 8) & 255,
          b: bigint & 255,
        };
      };

      const luminance = ({ r, g, b }) => {
        const t = (c) => {
          const v = c / 255;
          return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
        };
        return 0.2126 * t(r) + 0.7152 * t(g) + 0.0722 * t(b);
      };

      const contrastRatio = (a, b) => {
        const L1 = luminance(hexToRgb(a));
        const L2 = luminance(hexToRgb(b));
        return +((Math.max(L1, L2) + 0.05) / (Math.min(L1, L2) + 0.05)).toFixed(
          2,
        );
      };

      const pass = (r, t) => r >= t;

      function generateContrastGridSVG({
        gridBg,
        gridFg,
        colors,
        minContrast,
        maxContrast,
        uniqueMode,
      }) {
        const cellWidth = 220;
        const cellGap = 16;
        const headerHeight = 40;
        const rowLabelWidth = 120;

        // Tailwind spacing (px)
        const p5 = 20;
        const textBase = 16;
        const textSm = 14;
        const textXs = 12;
        const spaceY1 = 4;
        const gap2 = 8;

        const cardRadius = 24;
        const borderWidth = 2;
        const inset = borderWidth; // CONTENT ALWAYS INSIDE BORDER

        const isHidden = (bg, fg, bgIndex, fgIndex) => {
          const ratio = contrastRatio(bg, fg);
          if (minContrast > 0 && ratio < minContrast) return true;
          if (maxContrast !== Infinity && ratio >= maxContrast) return true;
          if (uniqueMode === "bg" && bgIndex > fgIndex) return true;
          if (uniqueMode === "fg" && bgIndex < fgIndex) return true;
          return false;
        };

        const width =
          rowLabelWidth +
          gridFg.length * cellWidth +
          (gridFg.length - 1) * cellGap;

        const height =
          headerHeight + gridBg.length * 360 + (gridBg.length - 1) * cellGap;

        let svg = `
<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}">
<defs>
  <!-- tailwind shadow-sm equivalent -->
  <filter id="top-shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="rgba(0,0,0,0.25)"/>
  </filter>
</defs>
`;

        /* HEADERS */
        gridFg.forEach((fg, colIndex) => {
          const x =
            rowLabelWidth + colIndex * (cellWidth + cellGap) + cellWidth / 2;
          svg += `<text x="${x}" y="24" font-size="14" text-anchor="middle">${fg}</text>`;
        });

        /* ROWS */
        gridBg.forEach((bg, rowIndex) => {
          const rowY = headerHeight + rowIndex * (360 + cellGap);
          svg += `<text x="${rowLabelWidth - 8}" y="${rowY + 28}" font-size="14" text-anchor="end">${bg}</text>`;

          gridFg.forEach((fg, colIndex) => {
            const bgIndex = colors.indexOf(bg);
            const fgIndex = colors.indexOf(fg);
            if (isHidden(bg, fg, bgIndex, fgIndex)) return;

            const x = rowLabelWidth + colIndex * (cellWidth + cellGap);
            const ratio = contrastRatio(bg, fg);

            let y = inset;
            let content = "";

            /* TOP PANEL */
            y += p5;
            content += `<text x="${p5 + inset}" y="${y + textBase}" font-size="${textBase}" font-weight="600" fill="${fg}">${ratio}:1</text>`;
            y += textBase + gap2;

            [
              `${pass(ratio, 3) ? "✅" : "❌"} 3:1 (Graphics)`,
              `${pass(ratio, 4.5) ? "✅" : "❌"} 4.5:1 (AA)`,
              `${pass(ratio, 7) ? "✅" : "❌"} 7:1 (AAA)`,
            ].forEach((line) => {
              content += `<text x="${p5 + inset}" y="${y + textSm}" font-size="${textSm}" fill="${fg}">${line}</text>`;
              y += textSm + spaceY1;
            });

            y += p5;
            content += `<text x="${p5 + inset}" y="${y + textSm}" font-size="${textSm}" fill="${fg}">${bg} - Background</text>`;
            y += textSm + spaceY1;
            content += `<text x="${p5 + inset}" y="${y + textSm}" font-size="${textSm}" fill="${fg}">${fg} - Text</text>`;
            y += textSm + p5; // ✅ BOTTOM PADDING TOP PANEL

            const topHeight = y;

            /* BOTTOM PANEL */
            y += p5;
            content += `
        <text x="${p5 + inset}" y="${y + textXs}" font-size="${textXs}" fill="#000">${bg} ⇆ ${fg}</text>
        <text x="${cellWidth - p5 - inset}" y="${y + textXs}" font-size="${textXs}" font-weight="600" text-anchor="end" fill="#000">${ratio}:1</text>
      `;
            y += textXs + gap2;

            content += `
        <text x="${p5 + inset}" y="${y + textXs}" font-size="${textXs}" fill="#000">${pass(ratio, 3) ? "✅" : "❌"} Icons</text>
        <text x="${cellWidth / 2}" y="${y + textXs}" font-size="${textXs}" text-anchor="middle" fill="#000">${pass(ratio, 4.5) ? "✅" : "❌"} AA</text>
        <text x="${cellWidth - p5 - inset}" y="${y + textXs}" font-size="${textXs}" text-anchor="end" fill="#000">${pass(ratio, 7) ? "✅" : "❌"} AAA</text>
      `;
            y += textXs + p5;

            const cardHeight = y + inset;

            svg += `
<g transform="translate(${x}, ${rowY})">
  <!-- SINGLE SOURCE OF TRUTH FOR BORDER -->
  <rect
    x="0"
    y="0"
    width="${cellWidth}"
    height="${cardHeight}"
    rx="${cardRadius}"
    fill="#ffffff"
    stroke="${fg}"
    stroke-width="${borderWidth}"
  />

  <clipPath id="clip-${bgIndex}-${fgIndex}">
    <rect x="${inset}" y="${inset}" width="${cellWidth - inset * 2}" height="${cardHeight - inset * 2}" rx="${cardRadius - inset}"/>
  </clipPath>

  <g clip-path="url(#clip-${bgIndex}-${fgIndex})">
    <rect
      x="${inset}"
      y="${inset}"
      width="${cellWidth - inset * 2}"
      height="${topHeight - inset}"
      fill="${bg}"
      filter="url(#top-shadow)"
    />
    ${content}
  </g>
</g>`;
          });
        });

        svg += `</svg>`;
        return svg;
      }
      // -------- App --------

      function App() {
        const [input, setInput] = useState("#000000, #ffffff, #FF5733");

        const colors = useMemo(() => {
          return Array.from(new Set(input.match(/#[0-9A-Fa-f]{6}/g) || []));
        }, [input]);

        const bestFgForBg = useMemo(() => {
          const map = new Map();

          colors.forEach((bg) => {
            let bestFg = null;
            let bestRatio = -Infinity;

            colors.forEach((fg) => {
              const r = contrastRatio(bg, fg);
              if (r > bestRatio) {
                bestRatio = r;
                bestFg = fg;
              }
            });

            map.set(bg, bestFg);
          });

          return map;
        }, [colors]);

        const bestBgForFg = useMemo(() => {
          const map = new Map();

          colors.forEach((fg) => {
            let bestBg = null;
            let bestRatio = -Infinity;

            colors.forEach((bg) => {
              const r = contrastRatio(bg, fg);
              if (r > bestRatio) {
                bestRatio = r;
                bestBg = bg;
              }
            });

            map.set(fg, bestBg);
          });

          return map;
        }, [colors]);

        const [minContrast, setMinContrast] = useState(0);
        const [maxContrast, setMaxContrast] = useState(Infinity);

        const [uniqueMode, setUniqueMode] = useState("all");

        const [collapseEmpty, setCollapseEmpty] = useState(false);

        const isHidden = (bg, fg, bgIndex, fgIndex) => {
          const ratio = contrastRatio(bg, fg);

          if (minContrast > 0 && ratio < minContrast) return true;
          if (maxContrast !== Infinity && ratio >= maxContrast) return true;

          if (uniqueMode === "bg" && bgIndex > fgIndex) return true;
          if (uniqueMode === "fg" && bgIndex < fgIndex) return true;

          return false;
        };

        const visibleBg = useMemo(() => {
          return colors.filter((bg, bgIndex) =>
            colors.some((fg, fgIndex) => {
              return !isHidden(bg, fg, bgIndex, fgIndex);
            }),
          );
        }, [colors, minContrast, maxContrast, uniqueMode]);

        const visibleFg = useMemo(() => {
          return colors.filter((fg, fgIndex) =>
            colors.some((bg, bgIndex) => {
              return !isHidden(bg, fg, bgIndex, fgIndex);
            }),
          );
        }, [colors, minContrast, maxContrast, uniqueMode]);

        const gridBg = collapseEmpty ? visibleBg : colors;
        const gridFg = collapseEmpty ? visibleFg : colors;

        const exportSVG = () =>
          generateContrastGridSVG({
            gridBg,
            gridFg,
            colors,
            minContrast,
            maxContrast,
            uniqueMode,
          });

        const copySVGToClipboard = async () => {
          const svg = exportSVG();

          try {
            await navigator.clipboard.writeText(svg);
            alert("SVG skopiowane do schowka – wklej bezpośrednio do Figmy 👍");
          } catch (err) {
            alert("Nie udało się skopiować SVG do schowka");
          }
        };

        const downloadSVG = () => {
          const svg = exportSVG();
          const blob = new Blob([svg], {
            type: "image/svg+xml;charset=utf-8;",
          });
          const url = URL.createObjectURL(blob);

          const link = document.createElement("a");
          link.href = url;
          link.download = "wcag-contrast-grid.svg";
          document.body.appendChild(link);
          link.click();

          document.body.removeChild(link);
          URL.revokeObjectURL(url);
        };

        return (
          <div className="p-6 font-sans flex flex-col items-center">
            <h1 className="text-2xl font-bold mb-2">
              Color Contrast Matrix (WCAG)
            </h1>
            <p className="text-sm text-neutral-600 mb-4">
              Wklej listę kolorów w formacie HEX
            </p>
            <textarea
              rows="4"
              className="w-full max-w-xl p-3 border rounded-xl mb-6 font-mono text-sm"
              value={input}
              onChange={(e) => setInput(e.target.value)}
            />
<div className="mt-4 mb-6 flex flex-col gap-4 text-sm">

  {/* === WIERSZ 1: filtry + checkbox === */}
  <div className="flex flex-wrap items-center gap-6">
    <div className="flex items-center gap-2">
      <label className="font-medium">Min. kontrast:</label>
      <select
        className="border rounded px-2 py-1"
        value={minContrast}
        onChange={(e) => setMinContrast(Number(e.target.value))}
      >
        <option value={0}>Bez filtra</option>
        <option value={3}>3:1</option>
        <option value={4.5}>4.5:1</option>
        <option value={7}>7:1</option>
      </select>
    </div>

    <div className="flex items-center gap-2">
      <label className="font-medium">Max. kontrast:</label>
      <select
        className="border rounded px-2 py-1"
        value={maxContrast}
        onChange={(e) =>
          setMaxContrast(
            e.target.value === "inf" ? Infinity : Number(e.target.value)
          )
        }
      >
        <option value="inf">Bez filtra</option>
        <option value={3}>3:1</option>
        <option value={4.5}>4.5:1</option>
        <option value={7}>7:1</option>
      </select>
    </div>

    <div className="flex items-center gap-2">
      <label className="font-medium">Unikalność:</label>
      <select
        className="border rounded px-2 py-1"
        value={uniqueMode}
        onChange={(e) => setUniqueMode(e.target.value)}
      >
        <option value="all">Wszystkie pary</option>
        <option value="bg">Tylko tła</option>
        <option value="fg">Tylko fronty</option>
      </select>
    </div>

    <label className="flex items-center gap-2">
      <input
        type="checkbox"
        checked={collapseEmpty}
        onChange={(e) => setCollapseEmpty(e.target.checked)}
      />
      Ukryj puste wiersze i kolumny
    </label>
  </div>

  {/* === WIERSZ 2: buttony === */}
  <div className="flex gap-3 justify-center">
    <button
      onClick={copySVGToClipboard}
      className="px-4 py-2 rounded-xl border text-sm font-medium
                 bg-white hover:bg-neutral-100 shadow-sm"
    >
      Kopiuj SVG do schowka (Figma)
    </button>

    <button
      onClick={downloadSVG}
      className="px-4 py-2 rounded-xl border text-sm font-medium
                 bg-white hover:bg-neutral-100 shadow-sm"
    >
      Pobierz SVG
    </button>
  </div>

</div>

            <div className="overflow-auto p-5">
              <div
                className="grid gap-x-4 gap-y-4"
                style={{
                  gridTemplateColumns: `120px repeat(${gridFg.length}, minmax(220px, 1fr))`,
                }}
              >
                <div className="text-xs text-neutral-400 text-right pr-2">
                  BG \\ FG
                </div>

                {gridFg.map((c) => (
                  <div key={c} className="text-lg text-center font-mono">
                    {c}
                  </div>
                ))}

                {gridBg.map((bg) => {
                  const bgIndex = colors.indexOf(bg);

                  return (
                    <React.Fragment key={bg}>
                      <div className="flex items-center justify-end pr-2 font-mono text-lg">
                        {bg}
                      </div>

                      {gridFg.map((fg) => {
                        const fgIndex = colors.indexOf(fg);
                        const ratio = contrastRatio(bg, fg);
                        const hidden = isHidden(bg, fg, bgIndex, fgIndex);
                        const shouldHideCell = hidden && collapseEmpty;

                        return (
                          <div key={bg + fg}>
                            {!shouldHideCell && (
                              <div
                                className={`rounded-3xl overflow-hidden border-2 shadow-lg flex flex-col
        ${hidden && !collapseEmpty ? "opacity-0" : ""}`}
                                style={{ borderColor: fg }}
                              >
                                <div
                                  className="text-xs shadow-sm z-10"
                                  style={{ background: bg, color: fg }}
                                >
                                  <div className="p-5 font-semibold text-base">
                                    {ratio}:1
                                  </div>

                                  <div className="px-5 space-y-1 text-sm">
                                    <div>
                                      {pass(ratio, 3) ? "✅" : "❌"} 3:1
                                      (Graphics)
                                    </div>
                                    <div>
                                      {pass(ratio, 4.5) ? "✅" : "❌"} 4.5:1
                                      (AA)
                                    </div>
                                    <div>
                                      {pass(ratio, 7) ? "✅" : "❌"} 7:1 (AAA)
                                    </div>
                                  </div>

                                  <div className="p-5">
                                    <div>{bg} - Background</div>
                                    <div>{fg} - Text</div>
                                  </div>
                                </div>

                                <div
                                  className="p-5 text-xs flex flex-col gap-2"
                                  style={{
                                    background: "#ffffff",
                                    color: "#000000",
                                  }}
                                >
                                  <div className="flex justify-between">
                                    <div>
                                      {bg} ⇆ {fg}
                                    </div>
                                    <div className="font-bold">{ratio}:1</div>
                                  </div>

                                  <div className="flex justify-between">
                                    <div>
                                      {pass(ratio, 3) ? "✅" : "❌"} Icons
                                    </div>
                                    <div>
                                      {pass(ratio, 4.5) ? "✅" : "❌"} AA
                                    </div>
                                    <div>
                                      {pass(ratio, 7) ? "✅" : "❌"} AAA
                                    </div>
                                  </div>
                                </div>
                              </div>
                            )}
                          </div>
                        );
                      })}
                    </React.Fragment>
                  );
                })}
              </div>
            </div>

            <p className="text-xs text-neutral-500 mt-6 max-w-xl">
              Każdy blok zawiera pełny raport kontrastu: wartości, kolory tła i
              tekstu oraz status WCAG.
            </p>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
