<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WCAG Color Contrast Matrix Professional</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              neutral: {
                50: '#f9f9f9',
                100: '#f0f0f0',
                200: '#e5e5e5',
                300: '#d1d1d1',
                400: '#a3a3a3',
                500: '#737373',
                600: '#525252',
                700: '#404040',
                800: '#262626',
                900: '#111111',
              },
            },
            fontFamily: {
              sans: ['Inter', 'system-ui', 'sans-serif'],
            },
          },
        },
      }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600&display=swap" rel="stylesheet">

    <!-- React -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
      body {
        font-family: 'Inter', sans-serif;
      }
      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #e5e5e5;
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #d1d1d1;
      }

      .grid-container {
        display: block;
        overflow-x: auto;
        overflow-y: hidden;
        max-width: 100%;
        scrollbar-width: thin;
        -webkit-overflow-scrolling: touch;
      }

      .tri-state-filter {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.25rem 0.5rem;
        border-radius: 0.375rem;
        cursor: pointer;
        user-select: none;
        transition: all 0.15s ease;
        border: 1px solid transparent;
      }

      .tri-state-filter:hover {
        background: #f0f0f0;
      }

      .tri-state-filter.included {
        background: #f0fdf4;
        border-color: #dcfce7;
      }

      .tri-state-filter.excluded {
        background: #fef2f2;
        border-color: #fee2e2;
      }

      /* Range slider styling */
      input[type=range] {
        -webkit-appearance: none;
        width: 100%;
        background: transparent;
      }
      input[type=range]:focus {
        outline: none;
      }
      input[type=range]::-webkit-slider-runnable-track {
        width: 100%;
        height: 4px;
        cursor: pointer;
        background: #e5e5e5;
        border-radius: 2px;
      }
      input[type=range]::-webkit-slider-thumb {
        height: 16px;
        width: 16px;
        border-radius: 50%;
        background: #111111;
        cursor: pointer;
        -webkit-appearance: none;
        margin-top: -6px;
        box-shadow: 0 0 0 4px white;
        border: 1px solid #e5e5e5;
      }

      .segmented-control {
        display: flex;
        background: #f0f0f0;
        padding: 2px;
        border-radius: 0.5rem;
      }
      .segmented-item {
        flex: 1;
        text-align: center;
        padding: 0.375rem 0.5rem;
        font-size: 0.7rem;
        font-weight: 500;
        border-radius: 0.375rem;
        cursor: pointer;
        transition: all 0.2s;
        color: #737373;
      }
      .segmented-item.active {
        background: white;
        color: #111111;
        box-shadow: 0 1px 2px rgba(0,0,0,0.05);
      }
    </style>
  </head>

  <body class="bg-white text-neutral-900 font-sans antialiased">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useMemo, useEffect } = React;

      // -------- WCAG & Color helpers --------
      const hexToRgb = (hex) => {
        const clean = hex.replace("#", "");
        const bigint = parseInt(clean, 16);
        return {
          r: (bigint >> 16) & 255,
          g: (bigint >> 8) & 255,
          b: bigint & 255,
        };
      };

      const luminance = ({ r, g, b }) => {
        const t = (c) => {
          const v = c / 255;
          return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
        };
        return 0.2126 * t(r) + 0.7152 * t(g) + 0.0722 * t(b);
      };

      const getHsl = (hex) => {
        let { r, g, b } = hexToRgb(hex);
        r /= 255; g /= 255; b /= 255;
        const max = Math.max(r, g, b), min = Math.min(r, g, b);
        let h, s, l = (max + min) / 2;
        if (max === min) {
          h = s = 0;
        } else {
          const d = max - min;
          s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
          switch (max) {
            case r: h = (g - b) / d + (g < b ? 6 : 0); break;
            case g: h = (b - r) / d + 2; break;
            case b: h = (r - g) / d + 4; break;
          }
          h /= 6;
        }
        return { h: h * 360, s: s * 100, l: l * 100 };
      };

      const contrastRatio = (a, b) => {
        const L1 = luminance(hexToRgb(a));
        const L2 = luminance(hexToRgb(b));
        return +((Math.max(L1, L2) + 0.05) / (Math.min(L1, L2) + 0.05)).toFixed(
          2,
        );
      };

      const pass = (r, t) => r >= t;

      const checkVisualTension = (c1, c2) => {
        const hsl1 = getHsl(c1);
        const hsl2 = getHsl(c2);

        const lumDiff = Math.abs(hsl1.l - hsl2.l);
        const hueDiff = Math.min(Math.abs(hsl1.h - hsl2.h), 360 - Math.abs(hsl1.h - hsl2.h));
        const avgSat = (hsl1.s + hsl2.s) / 2;

        // Vibration check: similar luminance, high saturation, different hue
        if (lumDiff < 20 && avgSat > 50 && hueDiff > 45) return true;
        // High saturation complementary clash
        if (avgSat > 80 && hueDiff > 160) return true;

        return false;
      };

      function generateContrastGridSVG({
        gridBg,
        gridFg,
        colors,
        minContrast,
        maxContrast,
        uniqueMode,
        darknessFilter,
        rowFilters,
        colFilters
      }) {
        const cellWidth = 200;
        const cellGap = 12;
        const headerHeight = 60;
        const rowLabelWidth = 100;

        const p = 16;
        const textXs = 10;
        const textSm = 12;
        const textBase = 20;

        const isHidden = (bg, fg, bgIndex, fgIndex) => {
          const ratio = contrastRatio(bg, fg);
          if (ratio < minContrast) return true;
          if (maxContrast !== Infinity && ratio > maxContrast) return true;
          if (uniqueMode === "bg" && bgIndex > fgIndex) return true;
          if (uniqueMode === "fg" && bgIndex < fgIndex) return true;

          const lumBg = luminance(hexToRgb(bg));
          const lumFg = luminance(hexToRgb(fg));
          if (darknessFilter === "bg-darker" && lumBg >= lumFg) return true;
          if (darknessFilter === "fg-darker" && lumFg >= lumBg) return true;

          if (rowFilters[bg] === -1) return true;
          if (colFilters[fg] === -1) return true;

          const hasIncludedRows = Object.values(rowFilters).some(v => v === 1);
          const hasIncludedCols = Object.values(colFilters).some(v => v === 1);

          if (hasIncludedRows && rowFilters[bg] !== 1) return true;
          if (hasIncludedCols && colFilters[fg] !== 1) return true;

          return false;
        };

        const svgGridBg = gridBg.filter(bg => {
            const bgIndex = colors.indexOf(bg);
            return gridFg.some((fg) => {
                const fgIndex = colors.indexOf(fg);
                return !isHidden(bg, fg, bgIndex, fgIndex);
            });
        });
        const svgGridFg = gridFg.filter(fg => {
            const fgIndex = colors.indexOf(fg);
            return gridBg.some((bg) => {
                const bgIndex = colors.indexOf(bg);
                return !isHidden(bg, fg, bgIndex, fgIndex);
            });
        });

        const width = rowLabelWidth + (svgGridFg.length * (cellWidth + cellGap));
        const height = headerHeight + (svgGridBg.length * (240 + cellGap));

        let svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" font-family="sans-serif">`;

        /* HEADERS */
        svgGridFg.forEach((fg, colIndex) => {
          const x = rowLabelWidth + colIndex * (cellWidth + cellGap) + cellWidth / 2;
          svg += `<text x="${x}" y="34" font-size="11" text-anchor="middle" fill="#a3a3a3" font-weight="300">${fg}</text>`;
        });

        /* ROWS */
        svgGridBg.forEach((bg, rowIndex) => {
          const rowY = headerHeight + rowIndex * (240 + cellGap);
          svg += `<text x="${rowLabelWidth - 12}" y="${rowY + 24}" font-size="11" text-anchor="end" fill="#a3a3a3" font-weight="300">${bg}</text>`;

          svgGridFg.forEach((fg, colIndex) => {
            const bgIndex = colors.indexOf(bg);
            const fgIndex = colors.indexOf(fg);
            if (isHidden(bg, fg, bgIndex, fgIndex)) return;

            const x = rowLabelWidth + colIndex * (cellWidth + cellGap);
            const ratio = contrastRatio(bg, fg);
            const hasTension = checkVisualTension(bg, fg);

            svg += `
<g transform="translate(${x}, ${rowY})">
  <rect width="${cellWidth}" height="240" rx="12" fill="${bg}" stroke="#f0f0f0" stroke-width="1"/>
  <text x="${p}" y="${p + 24}" font-size="${textBase}" font-weight="200" fill="${fg}">${ratio}:1</text>
  ${hasTension ? `<text x="${cellWidth - p}" y="${p + 24}" font-size="16" text-anchor="end">⚠️</text>` : ""}

  <text x="${p}" y="${p + 50}" font-size="${textXs}" fill="${fg}" opacity="0.8" font-weight="300">${pass(ratio, 3) ? "✅" : "❌"} 3:1 Graphics</text>
  <text x="${p}" y="${p + 66}" font-size="${textXs}" fill="${fg}" opacity="0.8" font-weight="300">${pass(ratio, 4.5) ? "✅" : "❌"} 4.5:1 AA</text>
  <text x="${p}" y="${p + 82}" font-size="${textXs}" fill="${fg}" opacity="0.8" font-weight="300">${pass(ratio, 7) ? "✅" : "❌"} 7:1 AAA</text>

  <rect y="210" width="${cellWidth}" height="30" fill="#ffffff" opacity="0.9"/>
  <line x1="0" y1="210" x2="${cellWidth}" y2="210" stroke="#f0f0f0" stroke-width="1"/>
  <text x="${p}" y="228" font-size="9" fill="#a3a3a3" font-weight="300" letter-spacing="1">${fg} / ${bg}</text>
</g>`;
          });
        });

        svg += `</svg>`;
        return svg;
      }

      // -------- Components --------

      const TriStateFilter = ({ color, state, onChange }) => {
        const handleClick = () => {
          if (state === 0) onChange(1);
          else if (state === 1) onChange(-1);
          else onChange(0);
        };

        let statusClass = "";
        let dot = <div className="w-1.5 h-1.5 rounded-full bg-neutral-200"></div>;
        if (state === 1) { statusClass = "included"; dot = <div className="w-1.5 h-1.5 rounded-full bg-green-500"></div>; }
        if (state === -1) { statusClass = "excluded"; dot = <div className="w-1.5 h-1.5 rounded-full bg-red-500"></div>; }

        return (
          <div className={`tri-state-filter ${statusClass}`} onClick={handleClick}>
            <div className="w-3.5 h-3.5 rounded-sm shadow-sm border border-black/5" style={{ backgroundColor: color }}></div>
            <span className="text-[10px] font-light text-neutral-600 font-mono tracking-tighter">{color}</span>
            <div className="ml-auto">{dot}</div>
          </div>
        );
      };

      const RangeSlider = ({ label, value, min, max, step, onChange, thresholds }) => {
        return (
          <div className="space-y-2">
            <div className="flex justify-between items-center">
              <label className="text-[10px] font-medium text-neutral-400 uppercase tracking-wider">{label}</label>
              <span className="text-[11px] font-light font-mono bg-neutral-50 px-2 py-0.5 rounded border border-neutral-100">{value === Infinity ? '∞' : value}</span>
            </div>
            <input
              type="range"
              min={min}
              max={max}
              step={step}
              value={value === Infinity ? max : value}
              onChange={(e) => onChange(Number(e.target.value) === max ? (max === 21 ? Infinity : max) : Number(e.target.value))}
            />
            <div className="flex justify-between px-1">
              {thresholds.map(t => (
                <button
                  key={t}
                  onClick={() => onChange(t)}
                  className={`text-[9px] font-light transition-colors ${value === t ? 'text-black font-semibold' : 'text-neutral-300 hover:text-neutral-500'}`}
                >
                  {t}
                </button>
              ))}
            </div>
          </div>
        );
      };

      const SegmentedControl = ({ options, value, onChange, label }) => {
        return (
          <div className="space-y-2">
            <label className="text-[10px] font-medium text-neutral-400 uppercase tracking-wider">{label}</label>
            <div className="segmented-control">
              {options.map(opt => (
                <div
                  key={opt.value}
                  className={`segmented-item ${value === opt.value ? 'active' : ''}`}
                  onClick={() => onChange(opt.value)}
                >
                  {opt.label}
                </div>
              ))}
            </div>
          </div>
        );
      };

      // -------- App --------

      function App() {
        const [input, setInput] = useState("#000000, #ffffff, #2563eb, #db2777, #f59e0b, #10b981");
        const [minContrast, setMinContrast] = useState(0);
        const [maxContrast, setMaxContrast] = useState(Infinity);
        const [uniqueMode, setUniqueMode] = useState("all");
        const [collapseEmpty, setCollapseEmpty] = useState(false);
        const [darknessFilter, setDarknessFilter] = useState("all");

        const [rowFilters, setRowFilters] = useState({});
        const [colFilters, setColFilters] = useState({});

        const colors = useMemo(() => {
          return Array.from(new Set(input.match(/#[0-9A-Fa-f]{6}/g) || []));
        }, [input]);

        useEffect(() => {
          setRowFilters(prev => {
            const next = {};
            colors.forEach(c => {
              next[c] = prev[c] !== undefined ? prev[c] : 0;
            });
            return next;
          });
          setColFilters(prev => {
            const next = {};
            colors.forEach(c => {
              next[c] = prev[c] !== undefined ? prev[c] : 0;
            });
            return next;
          });
        }, [colors]);

        const isHidden = (bg, fg, bgIndex, fgIndex) => {
          const ratio = contrastRatio(bg, fg);

          if (ratio < minContrast) return true;
          if (maxContrast !== Infinity && ratio > maxContrast) return true;

          if (uniqueMode === "bg" && bgIndex > fgIndex) return true;
          if (uniqueMode === "fg" && bgIndex < fgIndex) return true;

          const lumBg = luminance(hexToRgb(bg));
          const lumFg = luminance(hexToRgb(fg));
          if (darknessFilter === "bg-darker" && lumBg >= lumFg) return true;
          if (darknessFilter === "fg-darker" && lumFg >= lumBg) return true;

          if (rowFilters[bg] === -1) return true;
          if (colFilters[fg] === -1) return true;

          const hasIncludedRows = Object.values(rowFilters).some(v => v === 1);
          const hasIncludedCols = Object.values(colFilters).some(v => v === 1);

          if (hasIncludedRows && rowFilters[bg] !== 1) return true;
          if (hasIncludedCols && colFilters[fg] !== 1) return true;

          return false;
        };

        const visibleBg = useMemo(() => {
          return colors.filter((bg, bgIndex) =>
            colors.some((fg, fgIndex) => {
              return !isHidden(bg, fg, bgIndex, fgIndex);
            }),
          );
        }, [colors, minContrast, maxContrast, uniqueMode, darknessFilter, rowFilters, colFilters]);

        const visibleFg = useMemo(() => {
          return colors.filter((fg, fgIndex) =>
            colors.some((bg, bgIndex) => {
              return !isHidden(bg, fg, bgIndex, fgIndex);
            }),
          );
        }, [colors, minContrast, maxContrast, uniqueMode, darknessFilter, rowFilters, colFilters]);

        const gridBg = collapseEmpty ? visibleBg : colors;
        const gridFg = collapseEmpty ? visibleFg : colors;

        const addColor = (hex) => {
          if (!colors.includes(hex)) {
            setInput(prev => {
                const trimmed = prev.trim();
                if (!trimmed) return hex;
                const lastChar = trimmed[trimmed.length - 1];
                if (lastChar === ',' || lastChar === ' ') return prev + hex;
                return prev + ", " + hex;
            });
          }
        };

        const exportSVG = () =>
          generateContrastGridSVG({
            gridBg,
            gridFg,
            colors,
            minContrast,
            maxContrast,
            uniqueMode,
            darknessFilter,
            rowFilters,
            colFilters
          });

        const copySVGToClipboard = async () => {
          const svg = exportSVG();
          try {
            await navigator.clipboard.writeText(svg);
            alert("SVG skopiowane do schowka!");
          } catch (err) {
            alert("Błąd kopiowania");
          }
        };

        const downloadSVG = () => {
          const svg = exportSVG();
          const blob = new Blob([svg], { type: "image/svg+xml;charset=utf-8;" });
          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.href = url;
          link.download = "contrast-grid.svg";
          link.click();
          URL.revokeObjectURL(url);
        };

        return (
          <div className="min-h-screen p-6 lg:p-20 flex flex-col items-center">
            <header className="max-w-4xl w-full mb-16 text-center">
              <h1 className="text-5xl font-light tracking-tight text-neutral-900 mb-4">
                WCAG Matrix
              </h1>
              <p className="text-neutral-400 font-light text-lg">
                Minimalistyczne narzędzie do analizy kontrastu i napięcia wizualnego.
              </p>
            </header>

            <main className="w-full space-y-12">
              {/* INPUT SECTION */}
              <section className="max-w-4xl mx-auto w-full">
                <div className="space-y-4">
                  <div className="flex items-center justify-between px-1">
                    <label className="text-[10px] font-medium text-neutral-400 uppercase tracking-[0.2em]">Kolory wejściowe</label>
                    <div className="flex gap-2">
                      <button onClick={() => addColor("#000000")} className="text-[9px] font-bold px-3 py-1 bg-neutral-50 hover:bg-neutral-100 text-neutral-500 rounded-full transition-all border border-neutral-100 uppercase tracking-wider">
                        + Black
                      </button>
                      <button onClick={() => addColor("#ffffff")} className="text-[9px] font-bold px-3 py-1 bg-neutral-50 hover:bg-neutral-100 text-neutral-500 rounded-full transition-all border border-neutral-100 uppercase tracking-wider">
                        + White
                      </button>
                    </div>
                  </div>
                  <textarea
                    rows="2"
                    className="w-full p-6 bg-neutral-50 border border-neutral-100 rounded-2xl font-mono text-xs focus:ring-1 focus:ring-neutral-200 focus:outline-none transition-all resize-none leading-relaxed"
                    placeholder="#000000, #ffffff..."
                    value={input}
                    onChange={(e) => setInput(e.target.value)}
                  />
                </div>
              </section>

              {/* FILTERS SECTION */}
              <section className="max-w-6xl mx-auto w-full grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-12 pt-8 border-t border-neutral-100">
                  {/* Range Sliders */}
                  <div className="space-y-8">
                    <RangeSlider
                      label="Kontrast Minimalny"
                      value={minContrast}
                      min={0} max={21} step={0.1}
                      onChange={setMinContrast}
                      thresholds={[0, 3, 4.5, 7, 21]}
                    />
                    <RangeSlider
                      label="Kontrast Maksymalny"
                      value={maxContrast}
                      min={0} max={21} step={0.1}
                      onChange={setMaxContrast}
                      thresholds={[0, 3, 4.5, 7, 21]}
                    />
                    <label className="flex items-center gap-3 text-[10px] font-medium text-neutral-400 uppercase tracking-wider cursor-pointer group">
                        <input type="checkbox" className="w-3.5 h-3.5 rounded-sm border-neutral-200 text-neutral-900 focus:ring-0 transition-all" checked={collapseEmpty} onChange={(e) => setCollapseEmpty(e.target.checked)} />
                        <span className="group-hover:text-black transition-colors">Ukryj puste</span>
                    </label>
                  </div>

                  {/* Toggles */}
                  <div className="space-y-6">
                    <SegmentedControl
                      label="Unikalność par"
                      value={uniqueMode}
                      onChange={setUniqueMode}
                      options={[
                        { label: 'Wszystkie', value: 'all' },
                        { label: 'Pół (Tła)', value: 'bg' },
                        { label: 'Pół (Teksty)', value: 'fg' }
                      ]}
                    />
                    <SegmentedControl
                      label="Relacja jasności"
                      value={darknessFilter}
                      onChange={setDarknessFilter}
                      options={[
                        { label: 'Wszystkie', value: 'all' },
                        { label: 'Tło ciemniejsze', value: 'bg-darker' },
                        { label: 'Tekst ciemniejszy', value: 'fg-darker' }
                      ]}
                    />
                  </div>

                  {/* Row/Col Filters */}
                  <div className="grid grid-cols-2 gap-8 col-span-1 lg:col-span-1">
                    <div className="space-y-3">
                      <h3 className="text-[10px] font-medium text-neutral-400 uppercase tracking-wider">Tło (Wiersze)</h3>
                      <div className="max-h-48 overflow-y-auto space-y-1 pr-2 scrollbar-thin">
                        {colors.map(c => <TriStateFilter key={c} color={c} state={rowFilters[c] || 0} onChange={(val) => setRowFilters(prev => ({...prev, [c]: val}))} />)}
                      </div>
                    </div>
                    <div className="space-y-3">
                      <h3 className="text-[10px] font-medium text-neutral-400 uppercase tracking-wider">Tekst (Kolumny)</h3>
                      <div className="max-h-48 overflow-y-auto space-y-1 pr-2 scrollbar-thin">
                        {colors.map(c => <TriStateFilter key={c} color={c} state={colFilters[c] || 0} onChange={(val) => setColFilters(prev => ({...prev, [c]: val}))} />)}
                      </div>
                    </div>
                  </div>

                  {/* Actions */}
                  <div className="flex flex-col gap-3 justify-end">
                      <button onClick={copySVGToClipboard} className="w-full py-2.5 px-4 bg-neutral-900 text-white rounded-xl text-[11px] font-medium hover:bg-neutral-800 transition-all active:scale-[0.98] uppercase tracking-widest">
                        Copy SVG
                      </button>
                      <button onClick={downloadSVG} className="w-full py-2.5 px-4 bg-white text-neutral-900 border border-neutral-100 rounded-xl text-[11px] font-medium hover:bg-neutral-50 transition-all active:scale-[0.98] uppercase tracking-widest">
                        Download SVG
                      </button>
                      <p className="text-[9px] text-neutral-300 italic leading-tight mt-2 px-1">
                        ⚠️ Oznacza wysokie napięcie wizualne (vibration), które może męczyć wzrok mimo dobrego kontrastu.
                      </p>
                  </div>
              </section>

              {/* GRID SECTION */}
              <section className="w-full flex justify-center pt-8">
                   <div className="grid-container py-4">
                      <div
                        className="inline-grid gap-4"
                        style={{
                          gridTemplateColumns: `100px repeat(${gridFg.length}, 200px)`,
                        }}
                      >
                        {/* Header corner */}
                        <div className="flex items-center justify-end pr-4 text-[9px] font-light text-neutral-300 uppercase tracking-[0.3em] leading-tight text-right">
                          BG<br/>&bull;<br/>FG
                        </div>

                        {/* Column headers */}
                        {gridFg.map((c) => (
                          <div key={c} className="flex flex-col items-center justify-center p-2 rounded-xl bg-neutral-50/50 border border-neutral-100/50">
                            <div className="w-6 h-1 rounded-full mb-2" style={{ backgroundColor: c }}></div>
                            <div className="font-mono text-[9px] text-neutral-400 font-light tracking-tighter">{c}</div>
                          </div>
                        ))}

                        {/* Rows */}
                        {gridBg.map((bg) => {
                          const bgIndex = colors.indexOf(bg);
                          const isRowHidden = gridFg.every(fg => isHidden(bg, fg, bgIndex, colors.indexOf(fg)));
                          if (collapseEmpty && isRowHidden) return null;

                          return (
                            <React.Fragment key={bg}>
                              {/* Row header */}
                              <div className="flex items-center justify-end pr-4 gap-3">
                                <div className="font-mono text-[9px] text-neutral-400 font-light tracking-tighter">{bg}</div>
                                <div className="w-1 h-6 rounded-full" style={{ backgroundColor: bg }}></div>
                              </div>

                              {/* Cells */}
                              {gridFg.map((fg) => {
                                const fgIndex = colors.indexOf(fg);
                                const ratio = contrastRatio(bg, fg);
                                const hidden = isHidden(bg, fg, bgIndex, fgIndex);
                                const hasTension = checkVisualTension(bg, fg);

                                if (collapseEmpty && hidden) {
                                  return <div key={bg + fg} className="w-[200px]"></div>;
                                }

                                return (
                                  <div key={bg + fg} className="w-[200px] h-[240px]">
                                    <div
                                      className={`rounded-2xl overflow-hidden border border-neutral-100 transition-all duration-300 flex flex-col h-full
                                      ${hidden ? "opacity-5 grayscale blur-[1px] pointer-events-none scale-95" : "hover:shadow-lg hover:border-neutral-200"}`}
                                    >
                                      {/* Top part */}
                                      <div
                                        className="p-5 flex-grow flex flex-col justify-between"
                                        style={{ background: bg, color: fg }}
                                      >
                                        <div className="flex justify-between items-start">
                                          <div className="text-3xl font-extralight tracking-tighter">{ratio}:1</div>
                                          {hasTension && !hidden && <span title="Wysokie napięcie wizualne (vibration)" className="text-lg">⚠️</span>}
                                        </div>

                                        <div className="space-y-1.5 mb-2">
                                          <div className="flex items-center gap-2 text-[10px] font-light opacity-80">
                                            <span>{pass(ratio, 3) ? "✅" : "❌"}</span>
                                            <span>3:1 Graphics</span>
                                          </div>
                                          <div className="flex items-center gap-2 text-[10px] font-light opacity-80">
                                            <span>{pass(ratio, 4.5) ? "✅" : "❌"}</span>
                                            <span>4.5:1 AA Text</span>
                                          </div>
                                          <div className="flex items-center gap-2 text-[10px] font-light opacity-80">
                                            <span>{pass(ratio, 7) ? "✅" : "❌"}</span>
                                            <span>7:1 AAA Text</span>
                                          </div>
                                        </div>
                                      </div>

                                      {/* Bottom part */}
                                      <div className="bg-white px-5 py-2.5 flex justify-between items-center border-t border-neutral-50">
                                        <span className="text-[9px] text-neutral-300 font-light tracking-widest uppercase">{fg}</span>
                                        <span className="text-[9px] text-neutral-300 font-light tracking-widest uppercase">{bg}</span>
                                      </div>
                                    </div>
                                  </div>
                                );
                              })}
                            </React.Fragment>
                          );
                        })}
                      </div>
                   </div>
              </section>
            </main>

            <footer className="mt-32 text-center text-neutral-300 text-[10px] font-light tracking-widest uppercase pb-20 max-w-2xl leading-relaxed">
              <p className="mb-4">&bull; WCAG Matrix Professional &bull;</p>
              <p className="opacity-50">
                Luminancja względna i kontrast zgodny z WCAG 2.1. Detekcja napięcia wizualnego oparta na różnicy barw i nasyceniu.
              </p>
            </footer>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
